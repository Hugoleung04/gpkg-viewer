<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12192b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GPKG Viewer" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Offline GeoPackage Viewer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="btn icon-btn" id="btn-menu" type="button" aria-label="Layers and settings">☰</button>
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        GeoPackage Viewer
        <small>Works on phone and desktop — files stay on this device</small>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <label class="btn btn-primary" id="btn-open" for="file-input">Open</label>
      <button class="btn" id="btn-fit" type="button">Fit</button>
      <button class="btn desktop-only" id="btn-clear" type="button">Clear</button>
    </div>
  </header>

  <div class="backdrop" id="backdrop" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head mobile-only">
      <strong>Layers &amp; settings</strong>
      <button class="btn icon-btn" id="btn-close-menu" type="button" aria-label="Close">✕</button>
    </div>
    <label class="dropzone" id="dropzone" for="file-input">
      <strong>Open a GeoPackage</strong>
      <div class="hint">Phone: tap here, then Browse in Files and choose the .gpkg. Desktop: click or drop the file.</div>
    </label>

    <div class="settings-card">
      <label class="field">Basemap
        <select id="basemap">
          <option value="blank" selected>Blank (offline)</option>
          <option value="osm">OpenStreetMap</option>
          <option value="esri">Satellite</option>
          <option value="carto">Carto Dark</option>
        </select>
      </label>
      <label class="field check">
        <input type="checkbox" id="show-labels" checked />
        Show IDs on map
      </label>
      <label class="field">Marker size <span id="marker-size-val">4</span>
        <input id="marker-size" type="range" min="2" max="12" step="1" value="4" />
      </label>
      <label class="field">Label size <span id="label-size-val">9</span>
        <input id="label-size" type="range" min="7" max="16" step="1" value="9" />
      </label>
      <label class="field">Label field
        <select id="label-field">
          <option value="">(auto)</option>
        </select>
      </label>
      <label class="field">Feature cap
        <select id="limit">
          <option value="5000">5,000</option>
          <option value="25000" selected>25,000</option>
          <option value="100000">100,000</option>
          <option value="500000">500,000</option>
        </select>
      </label>
      <button class="btn mobile-only full" id="btn-clear-mobile" type="button">Clear all files</button>
    </div>

    <div class="file-list" id="file-list">
      <p class="empty-hint">No files loaded yet.</p>
    </div>
    <div class="sidebar-foot" id="stats"></div>
  </aside>

  <div id="map"></div>
  <div class="status" id="status">Starting…</div>

  <section class="table-panel" id="table-panel">
    <div class="table-bar">
      <button class="btn btn-ghost" id="btn-toggle-table" type="button">▴ / ▾</button>
      <strong id="table-title">Attributes</strong>
      <span class="table-hint">Tap a layer · tap a feature for details</span>
    </div>
    <div class="table-wrap" id="table-wrap">
      <p class="empty-hint">Select a vector layer to inspect attributes.</p>
    </div>
  </section>

  <input id="file-input" class="file-input-ios" type="file" multiple />

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/geopackage.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
